{{- if .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-workers
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}, role: worker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: {{ .Release.Name }}, role: gateway}
      ports: [{protocol: TCP, port: 8000}]
{{- end }}
