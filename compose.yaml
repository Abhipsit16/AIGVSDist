name: aigvs
x-app: &app
  build: .
  image: aigvs-distributed:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &env
    AIGVS_DATABASE_URL: postgresql://aigvs:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aigvs
    AIGVS_API_KEY: ${AIGVS_API_KEY:?set AIGVS_API_KEY}
    AIGVS_INTERNAL_KEY: ${AIGVS_INTERNAL_KEY:?set AIGVS_INTERNAL_KEY}
    AIGVS_WORKERS: '["http://worker-1:8000","http://worker-2:8000","http://worker-3:8000"]'
    RAYON_NUM_THREADS: "2"
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: aigvs
      POSTGRES_DB: aigvs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aigvs -d aigvs"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    command: [migrate]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
  gateway:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *env
      AIGVS_ROLE: gateway
  worker-1:
    <<: *app
    environment:
      <<: *env
      AIGVS_ROLE: worker
  worker-2:
    <<: *app
    environment:
      <<: *env
      AIGVS_ROLE: worker
  worker-3:
    <<: *app
    environment:
      <<: *env
      AIGVS_ROLE: worker
volumes:
  postgres-data:
